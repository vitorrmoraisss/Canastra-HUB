{% extends 'master.html' %}
{% load static %}
{% block titulo %}Recuperar senha{% endblock %}
{% block conteudo %}
  <main class="auth">
    <div class="auth-card">
      <h1>Recuperar senha</h1>
      <p class="auth-lead">Informe seu e-mail. Enviaremos um link para criar uma nova senha.</p>

      <form action="{% url 'core:recuperar_senha' %}" method="POST" class="auth-form">
        {% csrf_token %}
        <div>
          <label for="txtEmail" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="txtEmail" name="txtEmail" placeholder="voce@exemplo.com" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar link</button>
      </form>

      <p class="auth-foot"><a href="{% url 'core:login' %}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar para o login</a></p>
    </div>
  </main>
{% endblock %}

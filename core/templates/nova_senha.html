{% extends 'master.html' %}
{% load static %}
{% block titulo %}Nova senha{% endblock %}
{% block conteudo %}
  <main class="auth">
    <div class="auth-card">
      <h1>Nova senha</h1>
      <p class="auth-lead">Use pelo menos 8 caracteres, com letra maiúscula, letra minúscula e número.</p>

      <form method="POST" class="auth-form">
        {% csrf_token %}
        <div>
          <label for="txtSenha" class="form-label">Nova senha</label>
          <input type="password" class="form-control" id="txtSenha" name="txtSenha" autocomplete="new-password" required />
        </div>
        <div>
          <label for="txtConfirmarSenha" class="form-label">Confirmar nova senha</label>
          <input type="password" class="form-control" id="txtConfirmarSenha" name="txtConfirmarSenha" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
      </form>
    </div>
  </main>
{% endblock %}

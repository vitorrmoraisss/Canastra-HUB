{% extends 'master.html' %}
{% load static %}
{% block conteudo %}
  <main>
    {% for hub in hubs %}
      <section class="imagemgrande-section">
        <a href="{% url 'core:hub_detalhe' nome_hub=hub.nome_hub %}" class="imagemgrande-link">
          <div class="imagemgrande-container">
            {% if hub.foto_hub %}
              <img src="{{ hub.foto_hub.url }}" alt="{{ hub.nome_hub }}" class="imagemgrande-background" />
            {% else %}
              <img src="{% static 'img/default-hub.jpg' %}" alt="{{ hub.nome_hub }}" class="imagemgrande-background" />
            {% endif %}
            <div class="imagemgrande-content">
              <h1>{{ hub.nome_hub }}</h1>

            </div>
          </div>
        </a>
        {% if pode_selecionar_hub %}
          <form method="post" action="{% url 'core:toggle_hub_interesse' hub_id=hub.id %}" class="hub-interesse-form">
            {% csrf_token %}
            <div class="form-check hub-interesse-check">
              <input type="checkbox" class="form-check-input" id="hub-interesse-{{ hub.id }}"
                     onchange="this.form.submit()"
                     {% if hub.id in hubs_vinculados %}checked{% endif %}>
              <label class="form-check-label" for="hub-interesse-{{ hub.id }}">
                Tenho interesse neste hub
              </label>
            </div>
          </form>
        {% endif %}
      </section>
    {% empty %}
      <p>Nenhum hub disponível no momento.</p>
    {% endfor %}
  </main>

  <script src="{% static 'js/scripts.js' %}"></script>
  
{% endblock %}

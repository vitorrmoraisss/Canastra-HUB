{% extends 'master.html' %}
{% load static %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <main class="auth">
    <div class="auth-card">
      <h1>Entrar</h1>
      <p class="auth-lead">Acesse sua conta para se candidatar a vagas, se inscrever em eventos e reservar espaços.</p>

      <form action="{% url 'core:login' %}" method="POST" class="auth-form">
        {% csrf_token %}
        <!-- Preserva a rota original para redirecionamento após o login -->
        <input type="hidden" name="next" value="{{ next }}">

        <div>
          <label for="txtEmail" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="txtEmail" name="txtEmail" placeholder="voce@exemplo.com" autocomplete="email" required />
        </div>

        <div>
          <div class="d-flex justify-content-between align-items-baseline">
            <label for="txtSenha" class="form-label">Senha</label>
            <a class="small" href="{% url 'core:recuperar_senha' %}">Esqueci a senha</a>
          </div>
          <input type="password" class="form-control" id="txtSenha" name="txtSenha" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>

      <p class="auth-foot">Ainda não tem conta? <a href="{% url 'core:cadastro' %}">Criar conta</a></p>
    </div>
  </main>
{% endblock %}

{% extends 'master.html' %}
{% block conteudo %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow-sm">
    <div class="card-body text-center p-4">
      {% include 'components/back_button.html' %}
      <h4 class="mb-3">Confirmar Remoção</h4>
      <p>Tem certeza que deseja remover o treinamento:</p>
      <p class="fw-bold text-danger">{{ treinamento.nome }}</p>
      <p class="text-muted small">Esta ação não pode ser desfeita.</p>
      <div class="d-flex gap-2 justify-content-center mt-3">
        <a href="{% url 'treinamento:listar_treinamentos' %}" class="btn btn-secondary">Cancelar</a>
        <form method="POST">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Confirmar Remoção</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

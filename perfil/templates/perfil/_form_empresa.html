<div class="abas" role="tablist" aria-label="Seções do perfil da empresa">
  <button type="button" role="tab" id="aba-empresa" aria-controls="painel-empresa" aria-selected="true"><i class="bi bi-building" aria-hidden="true"></i> Empresa</button>
  <button type="button" role="tab" id="aba-endereco" aria-controls="painel-endereco" aria-selected="false" tabindex="-1"><i class="bi bi-geo-alt" aria-hidden="true"></i> Endereço</button>
  <button type="button" role="tab" id="aba-hubs" aria-controls="painel-hubs" aria-selected="false" tabindex="-1"><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i> Hubs</button>
</div>

<!-- ═══════════ EMPRESA ═══════════ -->
<section class="painel" role="tabpanel" id="painel-empresa" aria-labelledby="aba-empresa">
  <fieldset class="secao-form">
    <legend>Responsável pela conta</legend>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="f-nome">Nome do responsável</label>
        <input type="text" id="f-nome" name="nome" class="form-control" value="{{ user.nome }}" autocomplete="name">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="f-email">E-mail</label>
        <input type="email" id="f-email" class="form-control" value="{{ user.email }}" disabled>
        <div class="form-text">O e-mail é usado para entrar e não pode ser alterado aqui.</div>
      </div>
    </div>
  </fieldset>

  <fieldset class="secao-form">
    <legend>Dados da empresa</legend>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="f-fantasia">Nome fantasia</label>
        <input type="text" id="f-fantasia" name="nomefantasia" class="form-control" value="{{ empresa.nomefantasia|default:'' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="f-razao">Razão social</label>
        <input type="text" id="f-razao" name="razao_social" class="form-control" value="{{ empresa.razao_social|default:'' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="f-cnpj">CNPJ</label>
        <input type="text" id="f-cnpj" name="cnpj" class="form-control" value="{{ empresa.cnpj|default:'' }}" inputmode="numeric" placeholder="00.000.000/0000-00">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="f-tel">Telefone</label>
        <input type="tel" id="f-tel" name="telefone" class="form-control" value="{{ empresa.telefone|default:'' }}" autocomplete="tel">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="f-segmento">Segmento</label>
        <input type="text" id="f-segmento" name="segmento" class="form-control" value="{{ empresa.segmento|default:'' }}" placeholder="Ex.: Laticínios, Tecnologia">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="f-tipo">Tipo de empresa</label>
        <select id="f-tipo" name="tipo_empresa" class="form-select">
          {% for valor, rotulo in tipos_empresa %}
            <option value="{{ valor }}" {% if empresa.tipo_empresa == valor %}selected{% endif %}>{{ rotulo }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </fieldset>
</section>

<!-- ═══════════ ENDEREÇO ═══════════ -->
<section class="painel" role="tabpanel" id="painel-endereco" aria-labelledby="aba-endereco" hidden>
  <fieldset class="secao-form">
    <legend>Endereço principal</legend>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="f-cep">CEP</label>
        <input type="text" id="f-cep" name="cep" class="form-control" value="{{ empresa.cep|default:'' }}" inputmode="numeric" autocomplete="postal-code">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="f-rua">Rua</label>
        <input type="text" id="f-rua" name="rua" class="form-control" value="{{ empresa.rua|default:'' }}" autocomplete="address-line1">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="f-numero">Número</label>
        <input type="number" min="0" id="f-numero" name="numero" class="form-control" value="{{ empresa.numero|default_if_none:'' }}">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="f-comp">Complemento <span class="opcional">opcional</span></label>
        <input type="text" id="f-comp" name="complemento" class="form-control" value="{{ empresa.complemento|default:'' }}" maxlength="25">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="estado">Estado</label>
        <select id="estado" name="estado" class="form-select" data-cidades="cidade">
          <option value="">Selecione</option>
          {% for estado in estados %}
            <option value="{{ estado.id }}" {% if empresa.estado and empresa.estado.id == estado.id %}selected{% endif %}>{{ estado.nome_estado }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="cidade">Cidade</label>
        <select id="cidade" name="cidade" class="form-select">
          <option value="">Selecione o estado primeiro</option>
          {% for cidade in cidades %}
            <option value="{{ cidade.id }}" {% if empresa.cidade and empresa.cidade.id == cidade.id %}selected{% endif %}>{{ cidade.nome_cidade }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </fieldset>
</section>

<!-- ═══════════ HUBS ═══════════ -->
<section class="painel" role="tabpanel" id="painel-hubs" aria-labelledby="aba-hubs" hidden>
  <fieldset class="secao-form">
    <legend>Hubs vinculados</legend>
    <p class="secao-ajuda">A empresa aparece como parceira e pode publicar vagas, eventos e produtos nestes hubs.</p>
    <div class="opcoes-grade">
      {% for hub in hubs %}
        <label class="opcao-cartao">
          <input class="form-check-input" type="checkbox" name="hubs" value="{{ hub.id }}" {% if hub.id in hubs_vinculados %}checked{% endif %}>
          <span>{{ hub.nome_hub }}</span>
        </label>
      {% empty %}
        <p class="vazio-inline">Nenhum hub disponível.</p>
      {% endfor %}
    </div>
  </fieldset>
</section>

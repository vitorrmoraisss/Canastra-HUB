{% extends 'masterAdm.html' %}
{% load static %}

{% block titulo %}Editar Empresa - Painel Administrativo{% endblock %}

{% block conteudo_admin %}
<div class="container-fluid px-4 py-4" style="max-width: 900px;">
    
    <!-- Botão de Voltar -->
    <div class="mb-3">
        <a href="{% url 'administrador:gerenciar_empresas' %}" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-arrow-left me-2"></i>Voltar para Gerenciar Empresas
        </a>
    </div>

    <div class="card border-0 shadow-sm p-4" style="border-radius: 12px;">
        <h3 class="fw-bold text-dark mb-1">Editar Empresa: {{ empresa.nomefantasia }}</h3>
        <p class="text-muted small mb-4">CNPJ: <span class="font-monospace">{{ empresa.cnpj }}</span></p>

        <form action="{% url 'administrador:alterar_empresa_admin' empresa.cnpj %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nome Fantasia</label>
                    <input type="text" name="txtNome" class="form-control" value="{{ empresa.nomefantasia }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Segmento</label>
                    <input type="text" name="txtSegmento" class="form-control" value="{{ empresa.segmento }}" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Razão Social</label>
                    <input type="text" name="txtRazaoSocial" class="form-control" value="{{ empresa.razao_social }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tipo de Empresa</label>
                    <input type="text" name="txtTipo" class="form-control" value="{{ empresa.tipo_empresa }}" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Telefone</label>
                    <input type="text" name="txtTelefone" class="form-control" value="{{ empresa.telefone }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Rua / Endereço</label>
                    <input type="text" name="txtRua" class="form-control" value="{{ empresa.rua }}" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">CEP</label>
                    <input type="text" name="txtCep" class="form-control" value="{{ empresa.cep }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Número</label>
                    <input type="text" name="txtNumero" class="form-control" value="{{ empresa.numero|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Complemento</label>
                    <input type="text" name="txtComplemento" class="form-control" value="{{ empresa.complemento }}">
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'administrador:gerenciar_empresas' %}" class="btn btn-light border px-4">Cancelar</a>
                <button type="submit" class="btn btn-success px-4 fw-semibold">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
